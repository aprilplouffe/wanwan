
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build web and prepare Android
        run: |
          npm run build
          if [ ! -f android/app/build.gradle ]; then
            echo "Android app module missing; regenerating Android project"
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/app/build.gradle

      - name: Prepare Wanwan icon
        run: |
          test -f img/wanwan.png
          mkdir -p assets
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("img/wanwan.png").convert("RGBA")
          image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (1024, 1024), "white")
          x = (1024 - image.width) // 2
          y = (1024 - image.height) // 2
          canvas.alpha_composite(image, (x, y))
          canvas.convert("RGB").save("assets/icon.png")
          PY

      - name: Generate Android app icon
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/wanwan-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wanwan-apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
