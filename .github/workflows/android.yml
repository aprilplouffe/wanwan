
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build web and prepare Android
        run: |
          npm run build
          if [ ! -f android/app/build.gradle ]; then
            echo "Regenerating Android project"
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/app/build.gradle

      - name: Prepare Wanwan icon
        run: |
          test -f img/wanwan.png
          mkdir -p assets
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("img/wanwan.png").convert("RGBA")
          image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (1024, 1024), "white")
          x = (1024 - image.width) // 2
          y = (1024 - image.height) // 2
          canvas.alpha_composite(image, (x, y))
          canvas.convert("RGB").save("assets/icon.png")
          PY

      - name: Generate Android icon
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/wanwan-release.jks
          test -s android/wanwan-release.jks

      - name: Configure release signing and version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if not all(os.environ.get(k) for k in
                     ("STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")):
              raise SystemExit("Missing signing secrets")

          if "signingConfigs {" in s:
              raise SystemExit("Existing signingConfigs: inspect before editing")

          marker = re.search(r'\bandroid\s*\{', s)
          if not marker:
              raise SystemExit("android block not found")

          signing = """
              signingConfigs {
                  wanwanRelease {
                      storeFile file("../wanwan-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          s = s[:marker.end()] + signing + s[marker.end():]

          release = re.search(r'\brelease\s*\{', s)
          if not release:
              raise SystemExit("release block not found")

          s = (s[:release.end()] +
               "\n            signingConfig signingConfigs.wanwanRelease\n" +
               s[release.end():])

          version = 10000 + int(os.environ["BUILD_NUMBER"])
          s, count = re.subn(
              r'\bversionCode\s+\d+',
              f'versionCode {version}',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("versionCode not found")

          p.write_text(s)
          print(f"Configured release versionCode {version}")
          PY

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and rename APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/wanwan-release-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wanwan-release-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
